version: "3.8"

services:
  app:
    build: .
    ports:
      - "8010:8010"
      - "3010:3010"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/CommunicationIQ}
      - JWT_SECRET=${JWT_SECRET:-commiq-dev-secret-do-not-use-in-prod}
      - APP_URL=http://localhost:3010
      - CORS_ORIGINS=["http://localhost:3010","http://127.0.0.1:3010"]
      - MEDIA_ROOT=/app/backend/tmp
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - NEXT_PUBLIC_API_URL=http://localhost:8010/api/v1
    depends_on:
      - mongo
    restart: unless-stopped
    volumes:
      - backend_tmp:/app/backend/tmp

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  backend_tmp:
